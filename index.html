<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuñape Monona — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Send+Flowers&family=Kaushan+Script&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cm-blue:#1E92D1;
    --cm-blue-2:#2288C2;
    --cm-blue-deep:#166695;
    --cm-gold:#F8B001;
    --cm-gold-light:#F8AF37;
    --cm-brown:#6E240D;
    --cm-ink:#2A2A2A;
    --cm-ink-soft:#4D4D4D;
    --cm-placeholder:#CCCCCC;
    --cm-line:#DCEFFA;
    --cm-green:#25D366;
    --cm-green-dark:#128C43;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#F5FAFD;
    color:var(--cm-ink);
    font-family:'Urbanist',sans-serif;
    padding-bottom:130px;
  }
  h1,h2,h3{font-family:'Urbanist',sans-serif;font-weight:800;}

  /* patrón de textura celeste, imitando el mosaico del empaque */
  .cm-pattern{
    background-color:var(--cm-blue);
    background-image:
      radial-gradient(circle at 10px 10px, rgba(255,255,255,0.10) 2px, transparent 2.5px),
      radial-gradient(circle at 30px 30px, rgba(255,255,255,0.10) 2px, transparent 2.5px);
    background-size:40px 40px;
  }

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed;inset:0;z-index:300;
    display:flex;align-items:center;justify-content:center;
    animation:fadeOutSplash 0.6s ease 1.6s forwards;
  }
  #splash img{width:220px;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.18));animation:popBadge 0.7s ease;}
  @keyframes popBadge{from{transform:scale(0.75);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes fadeOutSplash{to{opacity:0;visibility:hidden;pointer-events:none;}}

  /* ---------- WELCOME ---------- */
  #welcome{
    position:fixed;inset:0;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;overflow-y:auto;
  }
  #welcome h1{color:#fff;font-size:26px;margin:0 0 6px;font-weight:700;}
  #welcome .wordmark{width:250px;margin:0 auto 30px;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.15));}
  .choice-col{display:flex;flex-direction:column;gap:26px;align-items:center;position:relative;}
  .choice-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:inherit;}
  .choice-circle{
    width:92px;height:92px;border-radius:50%;
    background:#fff;border:3px solid rgba(255,255,255,0.85);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(5,40,60,0.25);
    transition:transform 0.15s ease;
  }
  .choice-btn:active .choice-circle{transform:scale(0.94);}
  .choice-circle svg{width:38px;height:38px;}
  .choice-label{color:#fff;font-weight:700;font-size:15px;}
  #welcome .signature-block{margin-top:38px;color:#fff;}
  #welcome .signature-block .tipo{font-family:'Send Flowers',cursive;font-size:22px;display:block;color:var(--cm-gold);}
  #welcome .signature-block .xavier{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;letter-spacing:1px;display:block;margin-top:2px;}
  #welcome .signature-block .receta{font-family:Georgia,serif;font-style:italic;font-size:12.5px;display:block;opacity:0.9;}
  #welcome .signature-block .lugar{font-size:11px;display:block;margin-top:4px;opacity:0.85;}
  #welcome .skip{margin-top:20px;background:none;border:none;color:rgba(255,255,255,0.8);font-size:12px;text-decoration:underline;cursor:pointer;font-weight:600;}

  /* ---------- HEADER (tabs) ---------- */
  header.app-header{
    background:var(--cm-blue);color:#fff;padding:18px 18px 0;position:relative;
  }
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .nav-icons{display:flex;gap:10px;}
  .nav-tab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;padding:0;text-decoration:none;}
  .nav-circle{
    width:52px;height:52px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;background:transparent;
  }
  .nav-circle svg{width:24px;height:24px;}
  .nav-tab.active .nav-circle{background:#fff;}
  .nav-tab.active .nav-circle svg{color:var(--cm-blue);}
  .nav-tab:not(.active) .nav-circle{border-color:rgba(255,255,255,0.7);}
  .nav-tab:not(.active) .nav-circle svg{color:var(--cm-gold);}
  .nav-label{font-size:12.5px;font-weight:700;color:#fff;}
  .header-wordmark{width:150px;margin-top:-6px;}
  .header-divider{height:8px;background:var(--cm-gold-light);margin-top:16px;}

  main{max-width:520px;margin:0 auto;padding:20px 16px 0;}
  .placeholder-note{
    margin:0 0 18px;padding:10px 14px;background:#fff;
    border:1.5px dashed var(--cm-gold);border-radius:12px;
    font-size:12px;color:var(--cm-ink-soft);text-align:center;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;}
  .card{display:flex;flex-direction:column;}
  .img-wrap{
    position:relative;aspect-ratio:1/1;background:var(--cm-placeholder);
    border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-placeholder{font-size:12.5px;color:#8a8a8a;text-align:center;padding:0 10px;}
  .edit-btn{
    position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;
    background:rgba(30,30,30,0.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .edit-btn svg{width:14px;height:14px;}
  .edit-panel{
    position:absolute;inset:0;background:rgba(20,50,70,0.92);display:none;
    flex-direction:column;justify-content:center;gap:7px;padding:12px;
  }
  .edit-panel.open{display:flex;}
  .edit-panel label{color:#fff;font-size:10.5px;font-weight:700;}
  .edit-panel input[type="text"]{width:100%;padding:6px 7px;border-radius:7px;border:none;font-size:11.5px;}
  .edit-panel .row{display:flex;gap:5px;}
  .edit-panel button{flex:1;padding:6px 5px;border-radius:7px;border:none;font-size:11px;font-weight:700;cursor:pointer;}
  .btn-apply{background:var(--cm-gold);color:#fff;}
  .btn-cancel{background:rgba(255,255,255,0.2);color:#fff;}

  .card-title{font-weight:800;color:var(--cm-blue);font-size:15px;margin:10px 0 2px;}
  .card-meta{font-size:12px;color:var(--cm-ink-soft);font-weight:600;margin-bottom:1px;}
  .card-unit{font-size:11.5px;color:var(--cm-ink-soft);}
  .qty-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px;}
  .qty-label{font-size:12.5px;color:var(--cm-gold-light);font-weight:800;}
  .stepper{display:flex;align-items:center;border-radius:8px;overflow:hidden;}
  .stepper button{width:26px;height:26px;border:none;background:var(--cm-blue);color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .stepper span{min-width:30px;text-align:center;font-weight:800;font-size:13px;background:#fff;border-top:1px solid var(--cm-line);border-bottom:1px solid var(--cm-line);height:26px;line-height:26px;}
  .subtotal{font-size:12px;color:var(--cm-ink);font-style:italic;margin-top:3px;}
  .subtotal b{font-style:normal;}
  .card-divider{height:2px;background:var(--cm-gold-light);margin-top:12px;border-radius:2px;}

  .trivia-cta{display:none;}

  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--cm-blue);color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .cart-left button{background:none;border:none;color:#fff;text-align:left;cursor:pointer;font-family:inherit;padding:0;}
  .cart-left .count{font-size:11px;opacity:0.9;font-weight:600;display:block;}
  .cart-left .total{font-size:19px;font-weight:800;display:block;}
  .cart-mid{text-align:center;font-family:Georgia,serif;font-size:10.5px;line-height:1.3;opacity:0.95;}
  .cart-mid .tipo{font-style:italic;display:block;font-size:9px;}
  .cart-mid .xavier{font-weight:700;letter-spacing:0.5px;font-size:12px;}
  .cart-right{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#fff;cursor:pointer;font-family:inherit;}
  .cart-right span{font-size:11px;font-weight:700;}
  .cart-right svg{width:26px;height:26px;}
  .wa-btn:disabled{opacity:0.5;}

  .ticket{display:none;max-width:520px;margin:0 auto 100px;background:#fff;border:1.5px dashed var(--cm-gold);border-radius:14px;padding:14px 16px;}
  .ticket.open{display:block;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dotted var(--cm-line);}
  .ticket-row:last-child{border-bottom:none;}
  .ticket-empty{font-size:13px;color:var(--cm-ink-soft);text-align:center;padding:8px 0;}
</style>
</head>

<script>
  const WHATSAPP_NUMBER = "59170000000";
  const SUPABASE_URL = "https://nntskukhtxxnbbhtmmpq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_edu0MAlmqqfAtyXsAQqZog_paAaQ1W-";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('goOrder').onclick = () => { document.getElementById('welcome').style.display = 'none'; };
  document.getElementById('skipWelcome').onclick = () => { document.getElementById('welcome').style.display = 'none'; };
  document.getElementById('goPlay').onclick = () => { window.location.href = 'trivia.html'; };
  setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 2300);

  const products = [
    { id:1, name:"Cuñape Tradicional", weight:"120 gr.", bagPrice:10.5, bagsPerPack:10, packPrice:100 },
    { id:2, name:"Cuñape Rosca", weight:"120 gr.", bagPrice:10.5, bagsPerPack:10, packPrice:100 },
    { id:3, name:"Cuñape Abre Fácil", weight:"120 gr.", bagPrice:9.5, bagsPerPack:10, packPrice:90 },
    { id:4, name:"Cuñape Cierre Hermético", weight:"140 gr.", bagPrice:10.5, bagsPerPack:10, packPrice:100 },
    { id:5, name:"Cuñape Mini Abre Fácil", weight:"60 gr.", bagPrice:5.0, bagsPerPack:20, packPrice:90 },
    { id:6, name:"Paraguayos", weight:"", bagPrice:7.5, bagsPerPack:10, packPrice:75 },
    { id:7, name:"Calitas", weight:"", bagPrice:7.5, bagsPerPack:10, packPrice:75 },
    { id:8, name:"Bizcocho Maíz", weight:"", bagPrice:10.0, bagsPerPack:10, packPrice:95 },
  ];

  const state = {};
  products.forEach(p => { state[p.id] = 0; });
  const grid = document.getElementById('grid');
  function fmt(n){ return n.toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  const editIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  function renderCard(p){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img-wrap" id="imgwrap-${p.id}">
        <div class="img-placeholder" id="imgph-${p.id}">Foto pendiente</div>
        <button class="edit-btn" id="editbtn-${p.id}">${editIcon}</button>
        <div class="edit-panel" id="editpanel-${p.id}">
          <label>Subir imagen</label>
          <input type="file" accept="image/*" id="filein-${p.id}" style="font-size:10px;color:#fff;">
          <label>O pegar URL</label>
          <input type="text" id="urlin-${p.id}" placeholder="https://...">
          <div class="row">
            <button class="btn-apply" id="applyurl-${p.id}">Aplicar</button>
            <button class="btn-cancel" id="canceledit-${p.id}">Cerrar</button>
          </div>
        </div>
      </div>
      <div class="card-title">${p.name}</div>
      ${p.weight ? `<div class="card-meta">${p.weight}</div>` : ''}
      <div class="card-unit">+${p.bagsPerPack} bolsas ${fmt(p.packPrice)} bs</div>
      <div class="card-unit">precio unitario ${fmt(p.bagPrice)} bs</div>
      <div class="qty-row">
        <div>
          <div class="qty-label">Bolsas</div>
          <div class="subtotal">Subtotal <b id="subtotal-${p.id}">0.00</b></div>
        </div>
        <div class="stepper">
          <button id="minus-${p.id}">–</button>
          <span id="qty-${p.id}">0</span>
          <button id="plus-${p.id}">+</button>
        </div>
      </div>
      <div class="card-divider"></div>
    `;
    grid.appendChild(card);

    document.getElementById(`plus-${p.id}`).onclick = () => updateQty(p.id, 1);
    document.getElementById(`minus-${p.id}`).onclick = () => updateQty(p.id, -1);
    document.getElementById(`editbtn-${p.id}`).onclick = () => document.getElementById(`editpanel-${p.id}`).classList.add('open');
    document.getElementById(`canceledit-${p.id}`).onclick = () => document.getElementById(`editpanel-${p.id}`).classList.remove('open');
    document.getElementById(`applyurl-${p.id}`).onclick = () => {
      const url = document.getElementById(`urlin-${p.id}`).value.trim();
      if(url) setImage(p.id, url);
      document.getElementById(`editpanel-${p.id}`).classList.remove('open');
    };
    document.getElementById(`filein-${p.id}`).onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        setImage(p.id, ev.target.result);
        document.getElementById(`editpanel-${p.id}`).classList.remove('open');
      };
      reader.readAsDataURL(file);
    };
  }

  function setImage(id, src){
    const wrap = document.getElementById(`imgwrap-${id}`);
    let img = wrap.querySelector('img');
    if(!img){ img = document.createElement('img'); wrap.insertBefore(img, wrap.firstChild); }
    img.src = src;
    const ph = document.getElementById(`imgph-${id}`);
    if(ph) ph.style.display = 'none';
  }

  function updateQty(id, delta){
    state[id] = Math.max(0, state[id] + delta);
    document.getElementById(`qty-${id}`).textContent = state[id];
    const p = products.find(x => x.id === id);
    document.getElementById(`subtotal-${id}`).textContent = fmt(state[id]*p.bagPrice);
    renderCart();
  }

  function renderCart(){
    const items = products.filter(p => state[p.id] > 0);
    const totalBags = items.reduce((s,p) => s + state[p.id], 0);
    const totalPrice = items.reduce((s,p) => s + state[p.id]*p.bagPrice, 0);
    document.getElementById('cartCount').textContent = totalBags === 0 ? '0 productos' : `${totalBags} bolsa${totalBags>1?'s':''}`;
    document.getElementById('cartTotal').textContent = fmt(totalPrice) + ' Bs.';
    document.getElementById('waBtn').disabled = items.length === 0;

    const ticket = document.getElementById('ticket');
    if(items.length === 0){
      ticket.innerHTML = '<div class="ticket-empty">Aún no agregaste productos</div>';
    } else {
      ticket.innerHTML = items.map(p => `
        <div class="ticket-row"><span>${p.name} × ${state[p.id]}</span><span>${fmt(state[p.id]*p.bagPrice)} Bs.</span></div>
      `).join('') + `<div class="ticket-row" style="font-weight:800;border-top:1.5px solid var(--cm-gold);margin-top:4px;padding-top:8px;"><span>Total</span><span>${fmt(totalPrice)} Bs.</span></div>`;
    }
  }

  document.getElementById('ticketToggle').onclick = () => document.getElementById('ticket').classList.toggle('open');

  document.getElementById('waBtn').onclick = async () => {
    const items = products.filter(p => state[p.id] > 0);
    if(items.length === 0) return;
    const totalPrice = items.reduce((s,p) => s + state[p.id]*p.bagPrice, 0);
    let msg = "Hola, quiero confirmar este pedido de Cuñape Monona:\n\n";
    items.forEach(p => { msg += `• ${p.name} x${state[p.id]} bolsa${state[p.id]>1?'s':''} — ${fmt(state[p.id]*p.bagPrice)} Bs.\n`; });
    msg += `\nTotal: ${fmt(totalPrice)} Bs.`;
    try{
      await sb.from('orders').insert({
        items: items.map(p => ({ name:p.name, qty:state[p.id], subtotal: state[p.id]*p.bagPrice })),
        total: totalPrice
      });
    }catch(e){ console.warn('No se pudo registrar el pedido:', e); }
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  products.forEach(renderCard);
  renderCart();
</script>
