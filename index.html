<head>
<meta charset="UTF-8">

<title>Cuñape Monona — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Send+Flowers&family=Kaushan+Script&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  :root{
    --cm-blue:#1E92D1;
    --cm-blue-2:#2288C2;
    --cm-blue-deep:#166695;
    --cm-gold:#F8B001;
    --cm-gold-light:#F8AF37;
    --cm-brown:#6E240D;
    --cm-ink:#2A2A2A;
    --cm-ink-soft:#4D4D4D;
    --cm-placeholder:#CCCCCC;
    --cm-line:#DCEFFA;
    --cm-green:#25D366;
    --cm-green-dark:#128C43;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:#F5FAFD;color:var(--cm-ink);
    font-family:'Urbanist',sans-serif;padding-bottom:130px;
  }
  h1,h2,h3{font-family:'Urbanist',sans-serif;font-weight:800;}

  /* patrón de fondo — archivo resuelto por el diseñador */

    background-size:155px 103px;
    background-repeat:repeat;
  }

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed;inset:0;z-index:300;
    display:flex;align-items:center;justify-content:center;
    animation:fadeOutSplash 0.6s ease 3.8s forwards;
  }
  #splash img{
    width:min(70vw,320px);
    animation:popBadge 0.7s ease, glowPulse 1.8s ease-in-out 0.7s infinite;
  }
  @keyframes popBadge{from{transform:scale(0.75);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes glowPulse{
    0%,100%{ filter:drop-shadow(0 12px 24px rgba(0,0,0,0.18)) drop-shadow(0 0 10px rgba(255,255,255,0.35)); }
    50%{ filter:drop-shadow(0 12px 24px rgba(0,0,0,0.18)) drop-shadow(0 0 34px rgba(255,193,7,0.75)); }
  }
  @keyframes fadeOutSplash{to{opacity:0;visibility:hidden;pointer-events:none;}}

  /* ---------- WELCOME ---------- */
  #welcome{
    position:fixed;inset:0;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;overflow-y:auto;
  }
  #welcome h1{color:#fff;font-size:26px;margin:0 0 10px;font-weight:700;}
  #welcome .logo-center{width:min(62vw,260px);margin:0 auto 30px;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.15));}
  .choice-col{display:flex;flex-direction:column;gap:24px;align-items:center;position:relative;}
  .choice-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:inherit;}
  .choice-circle{width:88px;height:88px;transition:transform 0.15s ease;}
  .choice-btn:active .choice-circle{transform:scale(0.94);}
  .choice-label{color:#fff;font-weight:700;font-size:15px;}
  #welcome .xavier-block{width:min(70vw,300px);margin:34px auto 0;}
  #welcome .skip{margin-top:20px;background:none;border:none;color:rgba(255,255,255,0.8);font-size:12px;text-decoration:underline;cursor:pointer;font-weight:600;}

  /* ---------- HEADER (fijo, íconos a la izquierda, logo superpuesto) ---------- */
  header.app-header{
    position:sticky;top:0;z-index:100;background:var(--cm-blue);
  }
  .header-inner{position:relative;max-width:560px;margin:0 auto;padding:16px 18px 26px;}
  .nav-icons-row{display:flex;gap:8px;}
  .nav-tab{background:none;border:none;cursor:pointer;font-family:inherit;padding:0;text-decoration:none;display:block;}
  .nav-tab svg{width:54px;height:54px;display:block;}
  .nav-section-label{color:#fff;font-weight:800;font-size:17px;margin-top:8px;}
  .header-logo-overlap{
    position:absolute;left:50%;top:2px;width:clamp(120px,34vw,170px);z-index:5;
    transform:translateX(-50%);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  .header-white-gap{height:4px;background:#fff;}
  .header-divider{height:10px;background:var(--cm-gold-light);}

  /* En pantallas angostas, el logo baja debajo de los íconos en vez de superponerse */
  @media (max-width:430px){
    .header-logo-overlap{
      position:static;transform:none;display:block;
      width:min(46vw,150px);margin:10px auto 0;
    }
    .nav-tab svg{width:clamp(44px,13vw,54px);height:clamp(44px,13vw,54px);}
  }

  main{max-width:520px;margin:0 auto;padding:20px 16px 0;}
  .placeholder-note{
    margin:0 0 18px;padding:10px 14px;background:#fff;
    border:1.5px dashed var(--cm-gold);border-radius:12px;
    font-size:12px;color:var(--cm-ink-soft);text-align:center;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;}
  @media (max-width:360px){
    .grid{gap:16px 12px;}
    .card-title{font-size:13.5px;}
  }
  .card{display:flex;flex-direction:column;}
  .img-wrap{
    position:relative;aspect-ratio:1/1;background:var(--cm-placeholder);
    border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-placeholder{font-size:12.5px;color:#8a8a8a;text-align:center;padding:0 10px;}
  .edit-btn{
    position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;
    background:rgba(30,30,30,0.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .edit-btn svg{width:14px;height:14px;}
  .edit-panel{
    position:absolute;inset:0;background:rgba(20,50,70,0.92);display:none;
    flex-direction:column;justify-content:center;gap:7px;padding:12px;
  }
  .edit-panel.open{display:flex;}
  .edit-panel label{color:#fff;font-size:10.5px;font-weight:700;}
  .edit-panel input[type="text"]{width:100%;padding:6px 7px;border-radius:7px;border:none;font-size:11.5px;}
  .edit-panel .row{display:flex;gap:5px;}
  .edit-panel button{flex:1;padding:6px 5px;border-radius:7px;border:none;font-size:11px;font-weight:700;cursor:pointer;}
  .btn-apply{background:var(--cm-gold);color:#fff;}
  .btn-cancel{background:rgba(255,255,255,0.2);color:#fff;}

  .card-title{font-weight:800;color:var(--cm-blue);font-size:15px;margin:10px 0 2px;}
  .card-title .weight-inline{color:var(--cm-gold-light);font-weight:700;}
  .card-meta{font-size:12px;color:var(--cm-ink-soft);font-weight:600;margin-bottom:1px;}
  .card-unit{font-size:11.5px;color:var(--cm-ink-soft);}
  .qty-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px;}
  .qty-label{font-size:12.5px;color:var(--cm-gold-light);font-weight:800;}
  .stepper{display:flex;align-items:center;border-radius:8px;overflow:hidden;}
  .stepper button{width:26px;height:26px;border:none;background:var(--cm-blue);color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .stepper span{min-width:30px;text-align:center;font-weight:800;font-size:13px;background:#fff;border-top:1px solid var(--cm-line);border-bottom:1px solid var(--cm-line);height:26px;line-height:26px;}
  .subtotal{font-size:12px;color:var(--cm-ink);font-style:italic;margin-top:3px;}
  .subtotal b{font-style:normal;}
  .card-divider{height:2px;background:var(--cm-gold-light);margin-top:12px;border-radius:2px;}

  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--cm-blue);color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));z-index:50;
  }
  .cart-inner{
    max-width:560px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .cart-left button{background:none;border:none;color:#fff;text-align:left;cursor:pointer;font-family:inherit;padding:0;}
  .cart-left .count{font-size:11px;opacity:0.9;font-weight:600;display:block;}
  .cart-left .total{font-size:19px;font-weight:800;display:block;}
  .cart-mid{width:clamp(70px,22vw,110px);flex-shrink:0;}
  .cart-mid svg{width:100%;display:block;}
  .cart-right{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#fff;cursor:pointer;font-family:inherit;flex-shrink:0;}
  .cart-right span{font-size:11px;font-weight:700;}
  .cart-right svg{width:26px;height:26px;}
  .wa-btn:disabled{opacity:0.5;}

  .ticket{display:none;max-width:520px;margin:0 auto 100px;background:#fff;border:1.5px dashed var(--cm-gold);border-radius:14px;padding:14px 16px;}
  .ticket.open{display:block;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dotted var(--cm-line);}
  .ticket-row:last-child{border-bottom:none;}
  .ticket-empty{font-size:13px;color:var(--cm-ink-soft);text-align:center;padding:8px 0;}  /* ---------- GRACIAS OVERLAY ---------- */
  #thanksOverlay{
    position:fixed;inset:0;z-index:400;
    background:rgba(10,60,90,0.55);
    display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  #thanksOverlay.open{display:flex;}
  .thanks-card{
    background:#fff;border-radius:20px;padding:30px 26px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.25);
    animation:thanksPop 0.35s ease;
  }
  @keyframes thanksPop{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .thanks-icon{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,var(--cm-gold),var(--cm-gold-light));
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .thanks-icon svg{width:36px;height:36px;color:#fff;}
  .thanks-card h3{font-family:'Urbanist',sans-serif;font-size:20px;font-weight:800;margin:0 0 8px;color:var(--cm-blue-deep);}
  .thanks-card p{font-family:'Urbanist',sans-serif;font-size:13.5px;color:var(--cm-ink-soft);margin:0 0 20px;line-height:1.5;}
  .thanks-card .thanks-total{font-family:'Urbanist',sans-serif;font-size:15px;font-weight:800;color:var(--cm-blue);margin-bottom:20px;}
  .thanks-btn-primary{
    display:block;width:100%;padding:13px;background:var(--cm-green);color:#fff;border:none;
    border-radius:14px;font-weight:800;font-size:14.5px;cursor:pointer;
    font-family:'Urbanist',sans-serif;
  }
</style>
</head>

  function renderCard(p){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="img-wrap" id="imgwrap-${p.id}">
        <div class="img-placeholder" id="imgph-${p.id}">Foto pendiente</div>

          <input type="file" accept="image/*" id="filein-${p.id}" style="font-size:10px;color:#fff;">

          <input type="text" id="urlin-${p.id}" placeholder="https://...">

            <button class="btn-apply" id="applyurl-${p.id}">Aplicar</button>

        </div>
      </div>

        <div class="stepper">
          <button id="minus-${p.id}">–</button>

          <button id="plus-${p.id}">+</button>

      </div>
      <div class="card-divider"></div>
    `;

    document.getElementById(`plus-${p.id}`).onclick = () => updateQty(p.id, 1);
    document.getElementById(`minus-${p.id}`).onclick = () => updateQty(p.id, -1);

    document.getElementById(`canceledit-${p.id}`).onclick = () => document.getElementById(`editpanel-${p.id}`).classList.remove('open');

    document.getElementById(`qty-${id}`).textContent = state[id];
    const p = products.find(x => x.id === id);
    document.getElementById(`subtotal-${id}`).textContent = fmt(state[id]*p.bagPrice);
    renderCart();
  }

  function renderCart(){
    const items = products.filter(p => state[p.id] > 0);
    const totalBags = items.reduce((s,p) => s + state[p.id], 0);
    const totalPrice = items.reduce((s,p) => s + state[p.id]*p.bagPrice, 0);
    document.getElementById('cartCount').textContent = totalBags === 0 ? '0 productos' : `${totalBags} bolsa${totalBags>1?'s':''}`;
    document.getElementById('cartTotal').textContent = fmt(totalPrice) + ' Bs.';
    document.getElementById('waBtn').disabled = items.length === 0;

    const ticket = document.getElementById('ticket');
    if(items.length === 0){
      ticket.innerHTML = '<div class="ticket-empty">Aún no agregaste productos</div>';
    } else {
      ticket.innerHTML = items.map(p => `
        <div class="ticket-row"><span>${p.name} × ${state[p.id]}</span><span>${fmt(state[p.id]*p.bagPrice)} Bs.</span></div>
      `).join('') + `<div class="ticket-row" style="font-weight:800;border-top:1.5px solid var(--cm-gold);margin-top:4px;padding-top:8px;"><span>Total</span><span>${fmt(totalPrice)} Bs.</span></div>`;
    }
  }

  document.getElementById('ticketToggle').onclick = () => document.getElementById('ticket').classList.toggle('open');

  document.getElementById('waBtn').onclick = async () => {
    const items = products.filter(p => state[p.id] > 0);
    if(items.length === 0) return;
    const totalPrice = items.reduce((s,p) => s + state[p.id]*p.bagPrice, 0);
    let msg = "Hola, quiero confirmar este pedido de Cuñape Monona:\n\n";
    items.forEach(p => { msg += `• ${p.name} x${state[p.id]} bolsa${state[p.id]>1?'s':''} — ${fmt(state[p.id]*p.bagPrice)} Bs.\n`; });
    msg += `\nTotal: ${fmt(totalPrice)} Bs.`;
    try{
      await sb.from('orders').insert({
        items: items.map(p => ({ name:p.name, qty:state[p.id], subtotal: state[p.id]*p.bagPrice })),
        total: totalPrice
      });
    }catch(e){ console.warn('No se pudo registrar el pedido:', e); }

    lastWhatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    document.getElementById('thanksTotal').textContent = `Total del pedido: ${fmt(totalPrice)} Bs.`;
    document.getElementById('thanksOverlay').classList.add('open');
  };

  let lastWhatsappUrl = '';

  document.getElementById('thanksSendBtn').onclick = () => {
    if(lastWhatsappUrl) window.open(lastWhatsappUrl, '_blank');
    document.getElementById('thanksOverlay').classList.remove('open');
    products.forEach(p => { state[p.id] = 0; document.getElementById(`qty-${p.id}`).textContent = '0'; document.getElementById(`subtotal-${p.id}`).textContent = '0.00'; });
    renderCart();
  };

  products.forEach(renderCard);
  renderCart();
</script>

</body>
</html>
